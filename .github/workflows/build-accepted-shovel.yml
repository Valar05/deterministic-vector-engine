name: Build accepted shovel SPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  accepted-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove accepted HTML bytes are frozen
        shell: bash
        run: test "$(sha256sum studies/saint-andrews-shovel/accepted.html | cut -d' ' -f1)" = "3218fe45e005fe2c2ae432b35fd25aea18e60e3ceec6adf1c855cb9c7015400b"

  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove source artwork equals accepted artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          accepted=Path('studies/saint-andrews-shovel/accepted.html').read_bytes()
          source=Path('studies/saint-andrews-shovel/source.svg').read_bytes().rstrip(b'\r\n')
          m=re.search(rb'(<svg\b.*?</svg>)',accepted,re.S)
          if not m: raise SystemExit('accepted artifact has no SVG')
          art=m.group(1)
          if hashlib.sha256(art).hexdigest()!='7511c9fd8ff9e833b22cd3d4af5e3e0a88dd435c17de665535e37ea0a5227dda':
              raise SystemExit('accepted SVG art hash changed')
          if source!=art: raise SystemExit('source artwork differs from accepted artwork')
          PY

  build-test:
    needs: [accepted-guard, source-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build capability around frozen parent
        run: python tools/build_accepted_shovel_spa.py
      - name: Run shovel regression tests
        run: python -m unittest tests/test_accepted_shovel_interactive.py -v
      - name: Re-prove art stayed frozen
        shell: bash
        run: git diff --exit-code -- studies/saint-andrews-shovel/source.svg studies/saint-andrews-shovel/accepted.html

  publish:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact deterministic SPA
        run: python tools/build_accepted_shovel_spa.py
      - name: Commit generated SPA when changed
        shell: bash
        run: |
          if git diff --quiet -- studies/saint-andrews-shovel/dist/index.html; then
            echo "Generated SPA already current."
            exit 0
          fi
          git config user.name "fortress-vector-builder"
          git config user.email "actions@users.noreply.github.com"
          git add studies/saint-andrews-shovel/dist/index.html
          git commit -m "Build accepted Saint Andrew shovel SPA"
          git push
