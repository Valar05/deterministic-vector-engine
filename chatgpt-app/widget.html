<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Noodle3D</title>
<style>
:root{color-scheme:dark;--ink:#dffcff;--cyan:#8df7ff;--panel:rgba(5,10,12,.72)}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#050708;font:600 14px/1.2 system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none}#app{position:relative;min-height:360px;height:100dvh}svg{position:absolute;inset:0;width:100%;height:100%;background:#050708}#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:20;padding:8px 10px;background:var(--panel);border:1px solid #28434a;border-radius:10px;pointer-events:none}#hud b{color:var(--cyan)}#hud span{display:block;font-size:11px;opacity:.8;margin-top:3px}.btn{position:absolute;z-index:30;min-width:56px;min-height:52px;border:1px solid #5d8289;border-radius:14px;background:rgba(6,14,17,.76);color:var(--ink);font-weight:800;touch-action:none}.btn:focus-visible{outline:3px solid white;outline-offset:2px}#full{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}#jump{right:max(18px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%}#keys{right:max(116px,calc(env(safe-area-inset-right) + 116px));bottom:max(38px,calc(env(safe-area-inset-bottom) + 38px))}#touch{position:absolute;inset:0;z-index:10}#move,#look{position:absolute;top:0;bottom:0;width:50%}#move{left:0}#look{right:0}#stick{display:none;position:absolute;width:116px;height:116px;margin:-58px 0 0 -58px;border:2px solid rgba(141,247,255,.45);border-radius:50%;pointer-events:none}#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(141,247,255,.28);border:2px solid rgba(141,247,255,.8)}#dpad{display:none;position:absolute;z-index:40;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px;gap:4px}#dpad.open{display:grid}#dpad button{background:#0b1518;color:white;border:1px solid #5d8289;border-radius:10px;font-size:22px}#dpad [data-d="f"]{grid-column:2}#dpad [data-d="l"]{grid-column:1;grid-row:2}#dpad [data-d="b"]{grid-column:2;grid-row:2}#dpad [data-d="r"]{grid-column:3;grid-row:2}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(pointer:fine){#move,#look{display:none}}
</style>
</head>
<body>
<main id="app" aria-label="Noodle3D first-person arena">
<svg id="view" role="img" aria-label="Perspective vector rendering of a deterministic 3D arena"></svg>
<div id="hud"><b>NOODLE3D</b><span id="status">booting…</span></div>
<div id="touch" aria-hidden="true"><div id="move"><div id="stick"><div id="knob"></div></div></div><div id="look"></div></div>
<button id="full" class="btn" type="button" aria-label="Enter fullscreen">FULL</button>
<button id="jump" class="btn" type="button" aria-label="Jump">JUMP</button>
<button id="keys" class="btn" type="button" aria-controls="dpad" aria-expanded="false">KEYS</button>
<nav id="dpad" aria-label="Accessible movement controls"><button data-d="f" aria-label="Move forward">▲</button><button data-d="l" aria-label="Move left">◀</button><button data-d="b" aria-label="Move backward">▼</button><button data-d="r" aria-label="Move right">▶</button></nav>
<p class="sr" id="help">Use W A S D or the left touch area to move. Drag the right side to look. Jump with Space or Jump. Use Keys for discrete movement controls.</p>
</main>
<script>
(()=>{'use strict';
const NS='http://www.w3.org/2000/svg', svg=document.querySelector('#view'), status=document.querySelector('#status');
const full=document.querySelector('#full'), jump=document.querySelector('#jump'), keysBtn=document.querySelector('#keys'), dpad=document.querySelector('#dpad');
const moveZone=document.querySelector('#move'),lookZone=document.querySelector('#look'),stick=document.querySelector('#stick'),knob=document.querySelector('#knob');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let s=hash(seed);return()=>{let t=s+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function arena(seed){const r=rng(seed),boxes=[],used=new Set();for(let tries=0;boxes.length<28&&tries<4096;tries++){const x=-40+4*Math.floor(r()*21),z=-40+4*Math.floor(r()*21),k=x+','+z;if(used.has(k)||Math.hypot(x,z+38)<7||Math.hypot(x,z-38)<7)continue;const w=1.35+r()*1.85,h=.8+r()*4.2,d=1.35+r()*1.85;used.add(k);boxes.push({id:'n'+boxes.length,c:[x,h/2,z],s:[w,h,d],g:Math.floor(r()*16)})}return boxes}
let seed=window.openai?.toolOutput?.seed||'controller-proof', boxes=arena(seed);
const p={x:0,y:0,z:-38,vx:0,vy:0,vz:0,yaw:Math.PI,pitch:0,ground:true}, key=new Set(), discr=new Set();
const inp={mx:0,my:0,lx:0,ly:0,jump:false};
function verts(b){const[x,y,z]=b.c,[w,h,d]=b.s,X=w/2,Y=h/2,Z=d/2;return [[x-X,y-Y,z-Z],[x+X,y-Y,z-Z],[x+X,y+Y,z-Z],[x-X,y+Y,z-Z],[x-X,y-Y,z+Z],[x+X,y-Y,z+Z],[x+X,y+Y,z+Z],[x-X,y+Y,z+Z]]}
const faces=[[0,3,2,1],[4,5,6,7],[0,4,7,3],[1,2,6,5],[3,7,6,2],[0,1,5,4]];
function cam(v){let x=v[0]-p.x,y=v[1]-(p.y+1.58),z=v[2]-p.z;const sy=Math.sin(-p.yaw),cy=Math.cos(-p.yaw);let x1=x*cy-z*sy,z1=x*sy+z*cy;const sp=Math.sin(-p.pitch),cp=Math.cos(-p.pitch);return[x1,y*cp-z1*sp,y*sp+z1*cp]}
function proj(v,w,h){if(v[2]>=-.08)return null;const f=.92*Math.min(w,h),q=-f/v[2];return[w/2+v[0]*q,h/2-v[1]*q,-v[2]]}
function shade(n,depth,g){const light=clamp(.24+.76*Math.max(0,n[1]*.65+n[2]*-.55+n[0]*.25),0,1),fog=clamp(1-depth/85,.12,1);const base=[[92,105,108],[126,76,56],[104,94,70],[67,84,89]][g%4];return`rgb(${base.map(v=>Math.round(v*light*fog)).join(',')})`}
function render(){const w=Math.max(320,svg.clientWidth),h=Math.max(240,svg.clientHeight);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);const out=[];
  for(const b of boxes){const vv=verts(b),cv=vv.map(cam);for(const fi of faces){const a=cv[fi[0]],bb=cv[fi[1]],c=cv[fi[2]];const ux=bb[0]-a[0],uy=bb[1]-a[1],uz=bb[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];const n=[uy*vz-uz*vy,uz*vx-ux*vz,ux*vy-uy*vx];const center=fi.map(i=>cv[i]).reduce((s,v)=>(s[0]+=v[0]/4,s[1]+=v[1]/4,s[2]+=v[2]/4,s),[0,0,0]);if(n[0]*center[0]+n[1]*center[1]+n[2]*center[2]>=0)continue;const pts=fi.map(i=>proj(cv[i],w,h));if(pts.some(x=>!x))continue;out.push({d:pts.reduce((s,x)=>s+x[2],0)/4,pts,col:shade(n.map(x=>x/(Math.hypot(...n)||1)),pts[0][2],b.g),id:b.id})}}
  out.sort((a,b)=>b.d-a.d);svg.replaceChildren();const bg=document.createElementNS(NS,'rect');bg.setAttribute('width',w);bg.setAttribute('height',h);bg.setAttribute('fill','#050708');svg.append(bg);
  const horizon=h/2+p.pitch*h*.35;for(let i=-12;i<=12;i++){const line=document.createElementNS(NS,'line');line.setAttribute('x1',0);line.setAttribute('x2',w);line.setAttribute('y1',horizon+i*24);line.setAttribute('y2',horizon+i*24);line.setAttribute('stroke','#17363b');line.setAttribute('stroke-width','1');line.setAttribute('opacity',String(clamp(.5-Math.abs(i)*.025,.08,.5)));svg.append(line)}
  for(const f of out){const el=document.createElementNS(NS,'polygon');el.setAttribute('points',f.pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' '));el.setAttribute('fill',f.col);el.setAttribute('stroke','#79dbe3');el.setAttribute('stroke-opacity','.34');el.setAttribute('stroke-width','1');el.dataset.noodle=f.id;svg.append(el)}
  const c=document.createElementNS(NS,'circle');c.setAttribute('cx',w/2);c.setAttribute('cy',h/2);c.setAttribute('r','2');c.setAttribute('fill','#dffcff');svg.append(c);
}
function boxHit(x,z,y){for(const b of boxes){const[X,Y,Z]=b.c,[w,h,d]=b.s;if(Math.abs(x-X)<w/2+.34&&Math.abs(z-Z)<d/2+.34&&y<h-.02)return b}return null}
function topAt(x,z){let t=0;for(const b of boxes){const[X,Y,Z]=b.c,[w,h,d]=b.s;if(Math.abs(x-X)<w/2-.08&&Math.abs(z-Z)<d/2-.08)t=Math.max(t,Y+h/2)}return t}
function axis(a,d){if(!d)return;const nx=a==='x'?p.x+d:p.x,nz=a==='z'?p.z+d:p.z,hit=boxHit(nx,nz,p.y);if(!hit){p.x=nx;p.z=nz;return}const top=hit.c[1]+hit.s[1]/2,rise=top-p.y;if(p.ground&&rise>0&&rise<=.62){p.y=top;p.x=nx;p.z=nz}}
function update(dt){const f=(key.has('f')||discr.has('f')?1:0)-(key.has('b')||discr.has('b')?1:0)+inp.my,s=(key.has('r')||discr.has('r')?1:0)-(key.has('l')||discr.has('l')?1:0)+inp.mx,l=Math.hypot(f,s)||1,F=f/Math.max(1,l),S=s/Math.max(1,l);p.yaw-=inp.lx*.003;p.pitch=clamp(p.pitch-inp.ly*.0025,-1.3,1.3);inp.lx=inp.ly=0;const sy=Math.sin(p.yaw),cy=Math.cos(p.yaw),wx=S*cy-F*sy,wz=-S*sy-F*cy,acc=(p.ground?34:10)*dt,spd=p.ground?8.8:7.5;p.vx+=(wx*spd-p.vx)*clamp(acc,0,1);p.vz+=(wz*spd-p.vz)*clamp(acc,0,1);if(inp.jump&&p.ground){p.vy=5.8;p.ground=false}inp.jump=false;if(!p.ground)p.vy-=15.8*dt;axis('x',p.vx*dt);axis('z',p.vz*dt);p.y+=p.vy*dt;const floor=topAt(p.x,p.z);if(p.y<=floor){p.y=floor;p.vy=0;p.ground=true}else p.ground=false;status.textContent=`seed ${seed} · ${boxes.length} noodles · ${p.x.toFixed(1)},${p.z.toFixed(1)}`}
let last=performance.now();function frame(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
const map={KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};addEventListener('keydown',e=>{if(map[e.code]){key.add(map[e.code]);e.preventDefault()}if(e.code==='Space'){inp.jump=true;e.preventDefault()}});addEventListener('keyup',e=>{if(map[e.code])key.delete(map[e.code])});
let mp=null,mo=[0,0];moveZone.onpointerdown=e=>{if(mp!==null)return;mp=e.pointerId;moveZone.setPointerCapture(mp);mo=[e.clientX,e.clientY];stick.style.cssText+=`;display:block;left:${e.clientX}px;top:${e.clientY}px`};moveZone.onpointermove=e=>{if(e.pointerId!==mp)return;let dx=e.clientX-mo[0],dy=e.clientY-mo[1],m=Math.hypot(dx,dy)||1,k=Math.min(1,52/m);dx*=k;dy*=k;knob.style.transform=`translate(${dx}px,${dy}px)`;inp.mx=dx/52;inp.my=-dy/52};function clearMove(e){if(e&&e.pointerId!==mp)return;mp=null;inp.mx=inp.my=0;stick.style.display='none';knob.style.transform=''}for(const n of['pointerup','pointercancel','lostpointercapture'])moveZone.addEventListener(n,clearMove);
let lp=null,ll=[0,0];lookZone.onpointerdown=e=>{if(lp!==null)return;lp=e.pointerId;lookZone.setPointerCapture(lp);ll=[e.clientX,e.clientY]};lookZone.onpointermove=e=>{if(e.pointerId!==lp)return;inp.lx+=e.clientX-ll[0];inp.ly+=e.clientY-ll[1];ll=[e.clientX,e.clientY]};for(const n of['pointerup','pointercancel','lostpointercapture'])lookZone.addEventListener(n,e=>{if(e.pointerId===lp)lp=null});
jump.onpointerdown=e=>{inp.jump=true;e.preventDefault()};jump.onclick=()=>inp.jump=true;
for(const b of dpad.querySelectorAll('button')){const d=b.dataset.d;b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);discr.add(d)};for(const n of['pointerup','pointercancel','lostpointercapture'])b.addEventListener(n,()=>discr.delete(d));b.onkeydown=e=>{if(e.code==='Enter'||e.code==='Space')discr.add(d)};b.onkeyup=()=>discr.delete(d);b.onblur=()=>discr.delete(d)}
keysBtn.onclick=()=>{const open=!dpad.classList.contains('open');dpad.classList.toggle('open',open);keysBtn.setAttribute('aria-expanded',String(open))};
full.onclick=async()=>{try{if(window.openai?.requestDisplayMode){const r=await window.openai.requestDisplayMode({mode:'fullscreen'});full.textContent=r?.mode==='fullscreen'?'EXIT':'FULL'}else if(!document.fullscreenElement){await document.documentElement.requestFullscreen();full.textContent='EXIT'}else{await document.exitFullscreen();full.textContent='FULL'}}catch(e){status.textContent='fullscreen unavailable'}};
function zero(){key.clear();discr.clear();inp.mx=inp.my=inp.lx=inp.ly=0;clearMove()}addEventListener('blur',zero);document.addEventListener('visibilitychange',()=>{if(document.hidden)zero()});
addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.toolOutput?.seed;if(s&&s!==seed){seed=s;boxes=arena(seed);p.x=0;p.y=0;p.z=-38;p.vx=p.vy=p.vz=0;p.yaw=Math.PI}});
})();
</script>
</body></html>
